name: Survev Obstacle Artwork Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_obstacle_art.mjs"
      - ".github/workflows/obstacle-art.yml"

permissions:
  contents: write

jobs:
  original-obstacle-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: referencia-survev
          path: _reference
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Extract metadata from original obstacle definitions and image files
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/generate_obstacle_art.mjs \
            _reference/reference/survev src/survev/map_obstacle_art.lua
      - name: Verify Lua metadata and sprite coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4
          luac5.4 -p src/survev/map_obstacle_art.lua
          lua5.4 -e 'local o=require("src.survev.map_obstacle_art"); local all,covered=0,0;for _,d in pairs(o) do all=all+1;if d.asset then covered=covered+1 end end;assert(all>150 and covered>50,"insufficient obstacle sprite coverage"); print("Obstacle metadata:",all,"resolved:",covered)'
      - name: Commit verifiable original sprite references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/survev/map_obstacle_art.lua
          if ! git diff --cached --quiet; then
            git commit -m "port: generate faithful Survev obstacle sprite definitions and resolved artwork paths"
            git push origin HEAD:main
          fi
