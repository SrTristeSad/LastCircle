name: Survev Structure Collision Definitions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_structure_collision.mjs"
      - ".github/workflows/structure-colliders.yml"

permissions:
  contents: write

jobs:
  original-stairs-and-masks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: referencia-survev
          path: _reference
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate source-accurate Survev stair and structure masks
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/generate_structure_collision.mjs \
            _reference/reference/survev src/survev/map_structure_collision.lua
      - name: Validate original source metadata on both Lua engines
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 luajit
          luac5.4 -p src/survev/map_structure_collision.lua
          lua5.4 -e 'local d=require("src.survev.map_structure_collision");local n,s,m=0,0,0;for _,v in pairs(d) do n=n+1;s=s+#v.stairs;m=m+#v.mask end;assert(n>5 and s>5 and m>0);print(n,s,m)'
          luajit -e 'local d=require("src.survev.map_structure_collision");assert(type(d)=="table")'
      - name: Commit upstream-derived structure collision definitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/survev/map_structure_collision.lua
          if ! git diff --cached --quiet; then
            git commit -m "port: generated exact Survev structure stairs and masks"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
