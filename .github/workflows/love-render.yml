name: LOVE Render Terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/survev/map_renderer.lua"
      - "src/survev/terrain_gen.lua"
      - "src/survev/spline.lua"
      - "src/survev/river.lua"
      - "src/survev/map_colors.lua"
      - "src/survev/building_renderer.lua"
      - "src/survev/map_building_art.lua"
      - "tests/love_render_project/**"
      - ".github/workflows/love-render.yml"

permissions:
  contents: read

jobs:
  actual-love-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original Survev source artwork
        uses: actions/checkout@v4
        with:
          ref: referencia-survev
          path: _reference
      - name: Install actual LOVE2D, librsvg and virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb librsvg2-bin
      - name: Prepare standalone test game
        run: cp -r src tests/love_render_project/src
      - name: Rasterize the original barrel and door SVGs
        run: |
          mkdir -p tests/love_render_project/assets/survev/img/map
          rsvg-convert -f png \
            _reference/reference/survev/client/public/img/map/map-barrel-01.svg \
            -o tests/love_render_project/assets/survev/img/map/map-barrel-01.png
          rsvg-convert -f png \
            _reference/reference/survev/client/public/img/map/map-door-01.svg \
            -o tests/love_render_project/assets/survev/img/map/map-door-01.png
          rsvg-convert -f png \
            _reference/reference/survev/client/public/img/map/map-building-shack-floor-01.svg \
            -o tests/love_render_project/assets/survev/img/map/map-building-shack-floor-01.png
          rsvg-convert -f png \
            _reference/reference/survev/client/public/img/map/map-building-shack-ceiling-01.svg \
            -o tests/love_render_project/assets/survev/img/map/map-building-shack-ceiling-01.png
      - name: Render actual upstream terrain polygons in OpenGL
        run: |
          timeout 45s xvfb-run -a love tests/love_render_project \
            > /tmp/love-render.log 2>&1
          cat /tmp/love-render.log
          grep -q TRUE_LOVE_SURVEV_TERRAIN_RENDER_SUCCESS /tmp/love-render.log
