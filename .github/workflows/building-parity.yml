name: Survev Building Sprite Fidelity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/survev/building_renderer.lua"
      - "src/survev/building_visibility.lua"
      - "src/survev/los_geometry.lua"
      - "src/survev/map_obstacle_art.lua"
      - "src/survev/building_surfaces.lua"
      - "src/survev/map_building_art.lua"
      - "scripts/check_building_parity.mjs"
      - "tests/building_parity.lua"
      - "tests/building_renderer_smoke.lua"
      - "tests/building_visibility.lua"
      - "tests/los_parity.lua"
      - "scripts/check_los_parity.mjs"
      - "tests/building_surface_parity.lua"
      - "scripts/check_building_surface_parity.mjs"
      - ".github/workflows/building-parity.yml"

permissions:
  contents: read

jobs:
  original-building-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: referencia-survev
          path: _reference
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Lua and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Compare ORIGINAL TS Building rendering offsets and layers in Lua 5.4
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_building_parity.mjs _reference/reference/survev lua5.4
      - name: Compare ORIGINAL TS Building rendering offsets and layers in LuaJIT
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_building_parity.mjs _reference/reference/survev luajit
      - name: Check image caching and ceiling state in both Lua runtimes
        run: |
          lua5.4 tests/building_renderer_smoke.lua
          luajit tests/building_renderer_smoke.lua
          lua5.4 tests/building_visibility.lua
          luajit tests/building_visibility.lua
      - name: Compare original obstacle ray cast and ceiling visibility (Lua 5.4)
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_los_parity.mjs _reference/reference/survev lua5.4
      - name: Compare original obstacle ray cast and ceiling visibility (LuaJIT)
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_los_parity.mjs _reference/reference/survev luajit
      - name: Compare source Survev floor material collisions (Lua 5.4)
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_building_surface_parity.mjs _reference/reference/survev lua5.4
      - name: Compare source Survev floor material collisions (LuaJIT)
        run: |
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            scripts/check_building_surface_parity.mjs _reference/reference/survev luajit
