name: Lua CI

on:
  push:
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua syntax checks
        run: |
          luac5.4 -p conf.lua
          luac5.4 -p main.lua
          luac5.4 -p src/survev/camera.lua
          luac5.4 -p src/survev/input_bindings.lua
          luac5.4 -p src/survev/game_config.lua
          luac5.4 -p tests/survev_parity.lua
      - name: Survev reference parity tests
        run: lua5.4 tests/survev_parity.lua
