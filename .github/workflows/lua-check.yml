name: Lua CI

on:
  push:
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 and LuaJIT (same family as LÖVE)
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Lua syntax checks (every port module)
        run: |
          set -e
          luac5.4 -p conf.lua
          luac5.4 -p main.lua
          for file in src/survev/*.lua tests/*.lua; do
            luac5.4 -p "$file"
            luajit -b "$file" /tmp/lastcircle-module.bc
          done
      - name: Shared camera, controls and constants parity
        run: |
          lua5.4 tests/survev_parity.lua
          luajit tests/survev_parity.lua
      - name: Original-source offline demo movement and doors
        run: |
          lua5.4 tests/offline_demo.lua
          luajit tests/offline_demo.lua
      - name: Survev source HUD semantics and offline inventory
        run: |
          lua5.4 tests/hud_smoke.lua
          luajit tests/hud_smoke.lua
      - name: Source Survev minimap and interaction prompt
        run: |
          lua5.4 tests/minimap_smoke.lua
          luajit tests/minimap_smoke.lua
          lua5.4 tests/interaction_hint.lua
          luajit tests/interaction_hint.lua
      - name: Survev ground loot and 25-category expandable inventory
        run: |
          lua5.4 tests/loot_smoke.lua
          luajit tests/loot_smoke.lua
      - name: Authoritative Survev match results (Lua 5.4 and LuaJIT)
        run: |
          lua5.4 scripts/test_results_overlay.lua
          luajit scripts/test_results_overlay.lua
      - name: Survev InputMsg consumables and PickupMsg feedback
        run: |
          lua5.4 tests/live_input_smoke.lua
          luajit tests/live_input_smoke.lua
          lua5.4 tests/pickup_feedback_smoke.lua
          luajit tests/pickup_feedback_smoke.lua
      - name: Server-authoritative equipment and weapon change notices
        run: |
          lua5.4 tests/equipment_tracker_smoke.lua
          luajit tests/equipment_tracker_smoke.lua
      - name: Authoritative inventory DropItemMsg and row hit tests
        run: |
          lua5.4 tests/drop_item_smoke.lua
          luajit tests/drop_item_smoke.lua
      - name: Headless LÖVE UI bootstrap checks
        run: |
          lua5.4 tests/main_smoke.lua
          luajit tests/main_smoke.lua
      - name: Survev terrain renderer / map palette smoke
        run: |
          lua5.4 tests/map_renderer_smoke.lua
          luajit tests/map_renderer_smoke.lua
      - name: Verify original Survev obstacle sprites and metadata
        run: |
          lua5.4 tests/obstacle_art_smoke.lua
          luajit tests/obstacle_art_smoke.lua
