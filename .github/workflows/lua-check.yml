name: Lua CI

on:
  push:
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua syntax checks
        run: |
          luac5.4 -p conf.lua
          luac5.4 -p main.lua
          luac5.4 -p src/world.lua
          luac5.4 -p src/game.lua
          luac5.4 -p tests/offline_smoke.lua
      - name: Offline logic smoke test
        run: lua5.4 tests/offline_smoke.lua
